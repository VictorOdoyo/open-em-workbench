[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-em-workbench"
version = "0.1.0"
readme = "README.md"
authors = [{name = "Victor Odoyo"}]
keywords = ["electromagnetics", "fdtd", "electrostatics", "waveguides", "simulation"]
description = "Reproducible field solvers and analytical experiments in computational electromagnetics"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.17,<0.18", "build>=1"]

[project.urls]
Repository = "https://github.com/VictorOdoyo/open-em-workbench"
Documentation = "https://github.com/VictorOdoyo/open-em-workbench/tree/main/docs"
Issues = "https://github.com/VictorOdoyo/open-em-workbench/issues"

[project.scripts]
emlab = "emlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
